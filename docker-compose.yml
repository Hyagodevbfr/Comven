services:
  postgres:
    image: postgres:16
    container_name: comven_postgres
    environment:
      POSTGRES_DB: comven
      POSTGRES_USER: comven
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comven -d comven"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: